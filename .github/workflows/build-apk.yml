name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU Torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clone Ezsynth
        run: git clone https://github.com/Trentonom0r3/Ezsynth.git ezsynth_lib

      - name: Download EF_RAFT models
        run: |
          mkdir -p ezsynth_lib/ezsynth/utils/flow_utils/ef_raft_models
          cd ezsynth_lib/ezsynth/utils/flow_utils/ef_raft_models
          curl -L -o 25000_ours-sintel.pth https://github.com/n3slami/Ef-RAFT/raw/master/models/25000_ours-sintel.pth
          curl -L -o ours-things.pth https://github.com/n3slami/Ef-RAFT/raw/master/models/ours-things.pth
          curl -L -o ours_sintel.pth https://github.com/n3slami/Ef-RAFT/raw/master/models/ours_sintel.pth

      - name: Build with PyInstaller
        run: pyinstaller pyinstaller.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToAnime-Windows
          path: dist/VideoToAnime.exe
