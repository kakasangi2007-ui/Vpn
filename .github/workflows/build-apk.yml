name: ساخت APK با Flet

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 دریافت کد
      uses: actions/checkout@v4

    - name: 🐍 نصب Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🔧 نصب وابستگی‌های سیستم
      run: |
        echo "⏳ به‌روزرسانی مخازن..."
        sudo apt-get update -qq
        echo "⏳ نصب JDK و ابزارهای مورد نیاز..."
        sudo apt-get install -y -qq openjdk-17-jdk curl git unzip xz-utils zip libglu1-mesa wget
        echo "✅ وابستگی‌های سیستم نصب شدند."

    - name: 📁 تنظیم متغیرهای محیطی
      run: |
        echo "⏳ تنظیم JAVA_HOME..."
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "✅ متغیرهای محیطی تنظیم شدند."

    - name: 🎯 نصب Flutter SDK
      run: |
        echo "⏳ دانلود Flutter SDK..."
        cd /opt
        sudo git clone --depth 1 -b stable https://github.com/flutter/flutter.git
        sudo chmod -R 777 /opt/flutter
        echo "/opt/flutter/bin" >> $GITHUB_PATH
        echo "FLUTTER_ROOT=/opt/flutter" >> $GITHUB_PATH
        echo "✅ Flutter SDK نصب شد."

    - name: 📦 نصب Flet و وابستگی‌ها
      run: |
        echo "⏳ نصب Flet و وابستگی‌ها..."
        python -m pip install --upgrade pip
        pip install flet
        if [ -f requirements.txt ]; then 
          echo "⏳ نصب وابستگی‌های پروژه..."
          pip install -r requirements.txt
        fi
        echo "✅ Flet و وابستگی‌ها نصب شدند."

    - name: 🔑 تنظیم مجوز Xray
      run: |
        if [ -f core/android/xray ]; then
          chmod +x core/android/xray
          echo "✅ مجوز اجرایی برای core/android/xray تنظیم شد."
        else
          echo "⚠️ هشدار: فایل xray در مسیر core/android/ پیدا نشد!"
        fi

    - name: 🏗️ ساخت APK با مسیر SDK سفارشی
      run: |
        echo "⏳ شروع ساخت APK..."
        export PATH="$PATH:/opt/flutter/bin"
        export FLUTTER_ROOT="/opt/flutter"
        
        # تنظیم مسیر SDK در پوشه کاربر (دسترسی نوشتن دارد)
        export ANDROID_HOME="$HOME/android-sdk"
        export ANDROID_SDK_ROOT="$HOME/android-sdk"
        mkdir -p $ANDROID_HOME
        
        echo "✅ ANDROID_HOME=$ANDROID_HOME"
        echo "✅ JAVA_HOME=$JAVA_HOME"
        
        # نصب cmdline-tools با sdkmanager
        echo "⏳ دانلود Android cmdline-tools..."
        cd $HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_HOME/cmdline-tools
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        rm commandlinetools-linux-11076708_latest.zip
        
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        
        echo "⏳ نصب platform-tools و build-tools..."
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
        
        echo "✅ Android SDK نصب شد."
        echo "⏳ شروع ساخت APK با Flet..."
        
        # استفاده از 'yes' برای پاسخ به تمام سوالات
        yes | flet build apk --verbose 2>&1 | tee build_log.txt
        
        echo "✅ فرآیند ساخت کامل شد."
        ls -la build/apk/ || echo "⚠️ پوشه build/apk/ وجود ندارد!"

    - name: 📤 آپلود APK
      uses: actions/upload-artifact@v4
      with:
        name: Vpn-App-APK
        path: build/apk/*.apk
      continue-on-error: true

    - name: 📤 آپلود لاگ ساخت
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build_log.txt
      continue-on-error: true

    - name: 📊 نمایش نتیجه
      run: |
        echo "========================================="
        echo "✅ فرآیند ساخت به پایان رسید."
        echo "========================================="
        if ls build/apk/*.apk 1> /dev/null 2>&1; then
          echo "🎉 APK ساخته شده و در Artifacts موجود است!"
          ls -la build/apk/
        else
          echo "⚠️ APK ساخته نشد. فایل Build-Log را بررسی کنید."
        fi
        echo "========================================="
