name: ساخت APK با Flet

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 دریافت کد
      uses: actions/checkout@v4

    - name: 🐍 نصب Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🔧 نصب وابستگی‌های سیستم
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq openjdk-17-jdk curl git unzip xz-utils zip libglu1-mesa wget

    - name: 📁 تنظیم متغیرهای محیطی
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: 🎯 نصب Flutter SDK
      run: |
        cd /opt
        sudo git clone --depth 1 -b stable https://github.com/flutter/flutter.git
        sudo chmod -R 777 /opt/flutter
        echo "/opt/flutter/bin" >> $GITHUB_PATH
        echo "FLUTTER_ROOT=/opt/flutter" >> $GITHUB_PATH

    - name: 📦 نصب Flet و وابستگی‌ها
      run: |
        python -m pip install --upgrade pip
        pip install flet
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🔑 تنظیم مجوز Xray
      run: |
        if [ -f core/android/xray ]; then
          chmod +x core/android/xray
          echo "✅ مجوز اجرایی برای core/android/xray تنظیم شد."
        fi

    - name: 🏗️ ساخت APK با ماژول vpn
      run: |
        export PATH="$PATH:/opt/flutter/bin"
        export FLUTTER_ROOT="/opt/flutter"
        export ANDROID_HOME="$HOME/android-sdk"
        export ANDROID_SDK_ROOT="$HOME/android-sdk"
        
        # نصب Android SDK
        mkdir -p $ANDROID_HOME
        cd $HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_HOME/cmdline-tools
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        rm commandlinetools-linux-11076708_latest.zip
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
        
        # ساخت APK با مشخص کردن ماژول vpn
        yes | flet build apk --module-name vpn --verbose 2>&1 | tee build_log.txt

    - name: 📤 آپلود APK
      uses: actions/upload-artifact@v4
      with:
        name: Vpn-App-APK
        path: build/apk/*.apk
      continue-on-error: true

    - name: 📤 آپلود لاگ ساخت
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build_log.txt
      continue-on-error: true

    - name: 📊 نمایش نتیجه
      run: |
        echo "========================================="
        echo "✅ فرآیند ساخت به پایان رسید."
        echo "========================================="
        if ls build/apk/*.apk 1> /dev/null 2>&1; then
          echo "🎉 APK ساخته شده و در Artifacts موجود است!"
          ls -la build/apk/
        else
          echo "⚠️ APK ساخته نشد. فایل Build-Log را بررسی کنید."
          echo "📂 محتویات دایرکتوری:"
          ls -la
        fi
        echo "========================================="
