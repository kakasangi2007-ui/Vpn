name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU Torch)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clone Ezsynth
        shell: pwsh
        run: |
          git clone https://github.com/Trentonom0r3/Ezsynth.git ezsynth_lib

      - name: Install Ezsynth requirements
        shell: pwsh
        run: |
          pip install -r ezsynth_lib/requirements.txt

      - name: Download EF_RAFT models
        shell: pwsh
        run: |
          $modelDir = "ezsynth_lib/ezsynth/utils/flow_utils/ef_raft_models"
          New-Item -ItemType Directory -Force -Path $modelDir -ErrorAction SilentlyContinue
          $baseUrl = "https://github.com/n3slami/Ef-RAFT/raw/master/models"
          Invoke-WebRequest -Uri "$baseUrl/25000_ours-sintel.pth" -OutFile "$modelDir/25000_ours-sintel.pth"
          Invoke-WebRequest -Uri "$baseUrl/ours-things.pth" -OutFile "$modelDir/ours-things.pth"
          Invoke-WebRequest -Uri "$baseUrl/ours_sintel.pth" -OutFile "$modelDir/ours_sintel.pth"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller pyinstaller.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToAnime-Windows
          path: dist/VideoToAnime.exe
